<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WordDrill">
  <!-- 满幅方形版本：给 iOS / Android 用。iOS 会自己按圆角裁切，
       所以这里不能预先画圆角，否则会出现"圆角里再套圆角"的双重描边。 -->
  <rect width="512" height="512" fill="#7C3AED"/>
  <g fill="#FFFFFF">
    <rect x="132" y="140" width="44" height="232" rx="14"/>
    <rect x="196" y="180" width="132" height="44" rx="14" opacity=".95"/>
    <rect x="196" y="252" width="184" height="44" rx="14" opacity=".8"/>
    <rect x="196" y="324" width="100" height="44" rx="14" opacity=".62"/>
  </g>
</svg>
