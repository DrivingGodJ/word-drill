<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="WordDrill Smart Learning Algorithm &amp; Customization Loop">
  <defs>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      @keyframes streamFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes nodePulse {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.12); }
      }
      .flow-beam {
        stroke-dasharray: 8 8;
        animation: streamFlow 1.9s linear infinite;
      }
      .pulse-dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: nodePulse 2.8s ease-in-out infinite;
      }
    </style>

    <linearGradient id="pipe1En" gradientUnits="userSpaceOnUse" x1="274" y1="126" x2="328" y2="126">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="pipe2En" gradientUnits="userSpaceOnUse" x1="572" y1="126" x2="626" y2="126">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>
    <linearGradient id="pipe3En" gradientUnits="userSpaceOnUse" x1="870" y1="126" x2="924" y2="126">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="416" rx="22" fill="#08090F" stroke="rgba(167,139,250,0.22)" stroke-width="1.5" />

  <text x="44" y="44" class="sans" font-size="16" font-weight="700" fill="#FFFFFF">Learning Loop: Smart New Words → Independent Recall → Spelling → FSRS-6 Mastery</text>
  <text x="1156" y="44" text-anchor="end" class="mono" font-size="13" fill="#A78BFA">FSRS-6 · ts-fsrs 5.4.2</text>

  <rect x="44" y="72" width="230" height="110" rx="14" fill="#131522" stroke="rgba(129,140,248,0.42)" />
  <circle class="pulse-dot" cx="68" cy="96" r="5" fill="#818CF8" />
  <text x="82" y="101" class="sans" font-size="15" font-weight="700" fill="#FFFFFF">1. Difficulty Picking</text>
  <text x="64" y="128" class="sans" font-size="13" fill="#CBD5E1">Balanced / Easy / Hard first</text>
  <text x="64" y="151" class="sans" font-size="12.5" fill="#94A3B8">Freq + difficulty · avoids look-alikes</text>

  <path class="flow-beam" d="M 274 126 L 328 126" stroke="url(#pipe1En)" stroke-width="2.5" fill="none" />

  <rect x="328" y="72" width="244" height="110" rx="14" fill="#1B1734" stroke="#7C3AED" stroke-opacity="0.7" />
  <circle class="pulse-dot" cx="352" cy="96" r="5" fill="#A78BFA" />
  <text x="366" y="101" class="sans" font-size="15" font-weight="700" fill="#FFFFFF">2. Independent Recall</text>
  <text x="348" y="128" class="sans" font-size="13" fill="#DDD6FE">Decide recall before viewing choices</text>
  <text x="348" y="151" class="sans" font-size="12.5" fill="#94A3B8">3+ distinct days &amp; ≥ 7d stability</text>

  <path class="flow-beam" d="M 572 126 L 626 126" stroke="url(#pipe2En)" stroke-width="2.5" fill="none" />

  <rect x="626" y="72" width="244" height="110" rx="14" fill="#18162E" stroke="#A78BFA" stroke-opacity="0.58" />
  <circle class="pulse-dot" cx="650" cy="96" r="5" fill="#C4B5FD" />
  <text x="664" y="101" class="sans" font-size="15" font-weight="700" fill="#FFFFFF">3. Active Spelling</text>
  <text x="646" y="128" class="sans" font-size="13" fill="#E9D5FF">Type from meaning + fix errors</text>
  <text x="646" y="151" class="sans" font-size="12.5" fill="#94A3B8">3+ distinct days &amp; ≥ 21d stability</text>

  <path class="flow-beam" d="M 870 126 L 924 126" stroke="url(#pipe3En)" stroke-width="2.5" fill="none" />

  <rect x="924" y="72" width="232" height="110" rx="14" fill="#0B2720" stroke="#34D399" stroke-opacity="0.65" />
  <circle class="pulse-dot" cx="948" cy="96" r="5" fill="#34D399" />
  <text x="962" y="101" class="sans" font-size="15" font-weight="700" fill="#D1FAE5">4. True Mastery</text>
  <text x="944" y="128" class="sans" font-size="13" fill="#6EE7B7">Hints &amp; cramming earn no credit</text>
  <text x="944" y="151" class="sans" font-size="12.5" fill="#94A3B8">Recognize-only skips stage 3</text>

  <line x1="44" y1="214" x2="1156" y2="214" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <text x="44" y="246" class="sans" font-size="15" font-weight="700" fill="#FFFFFF">Customizable Study &amp; Review</text>
  <text x="626" y="246" class="sans" font-size="15" font-weight="700" fill="#FFFFFF">Schedule-Safe Drills · Offline &amp; Sync</text>

  <rect x="44" y="264" width="548" height="110" rx="14" fill="#121420" stroke="rgba(167,139,250,0.22)" />
  <rect x="64" y="284" width="118" height="32" rx="8" fill="#1E1B38" />
  <text x="123" y="305" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#C4B5FD">0–40 Daily New</text>
  <rect x="194" y="284" width="122" height="32" rx="8" fill="#1E1B38" />
  <text x="255" y="305" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#C4B5FD">3 Difficulty Modes</text>
  <rect x="328" y="284" width="120" height="32" rx="8" fill="#1E1B38" />
  <text x="388" y="305" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#C4B5FD">3 Spelling Modes</text>
  <rect x="460" y="284" width="112" height="32" rx="8" fill="#1E1B38" />
  <text x="516" y="305" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#C4B5FD">3 Review Paces</text>
  <text x="64" y="346" class="sans" font-size="13" fill="#94A3B8">80–95% target retention · per-word spelling tags · synced across devices</text>

  <rect x="626" y="264" width="530" height="110" rx="14" fill="#121420" stroke="rgba(52,211,153,0.22)" />
  <rect x="646" y="284" width="110" height="32" rx="8" fill="#161B26" />
  <text x="701" y="305" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#ECEFF5">Context Fill</text>
  <rect x="768" y="284" width="110" height="32" rx="8" fill="#161B26" />
  <text x="823" y="305" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#ECEFF5">Dictation</text>
  <rect x="890" y="284" width="110" height="32" rx="8" fill="#161B26" />
  <text x="945" y="305" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#ECEFF5">Mistakes</text>
  <rect x="1012" y="284" width="124" height="32" rx="8" fill="#0B2720" />
  <text x="1074" y="305" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#34D399">Offline + Sync</text>
  <text x="646" y="346" class="sans" font-size="13" fill="#94A3B8">Extra drills preserve FSRS schedules · Local IndexedDB &amp; private GitHub</text>
</svg>
