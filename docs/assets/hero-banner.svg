<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="WordDrill · 更科学的背单词软件">
  <defs>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.42; transform: scale(1); }
        50% { opacity: 0.82; transform: scale(1.06); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(5px); }
      }
      @keyframes ringDraw {
        0%, 100% { stroke-dashoffset: 34; }
        50% { stroke-dashoffset: 12; }
      }
      .glow-orb {
        transform-box: fill-box;
        transform-origin: center;
        animation: glowPulse 5s ease-in-out infinite;
      }
      .card-float {
        animation: floatSlow 5.4s ease-in-out infinite;
      }
      .card-float-alt {
        animation: floatAlt 6.0s ease-in-out infinite;
      }
      .fsrs-arc {
        stroke-dasharray: 188;
        animation: ringDraw 5.5s ease-in-out infinite;
      }
    </style>

    <radialGradient id="bgGlow1" cx="0.22" cy="0.32" r="0.68">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.34" />
      <stop offset="58%" stop-color="#312E81" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#08090F" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlow2" cx="0.82" cy="0.68" r="0.52">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#7C3AED" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#08090F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" gradientUnits="userSpaceOnUse" x1="650" y1="54" x2="1140" y2="300">
      <stop offset="0%" stop-color="#171925" />
      <stop offset="100%" stop-color="#10121B" />
    </linearGradient>
    <linearGradient id="iconGrad" gradientUnits="userSpaceOnUse" x1="56" y1="50" x2="128" y2="122">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="376" rx="22" fill="#08090F" stroke="rgba(167,139,250,0.22)" stroke-width="1.5" />
  <rect x="2" y="2" width="1196" height="376" rx="22" fill="url(#bgGlow1)" />
  <rect x="2" y="2" width="1196" height="376" rx="22" fill="url(#bgGlow2)" />

  <!-- Left Brand & Core Learning Value -->
  <g transform="translate(56, 50)">
    <circle class="glow-orb" cx="36" cy="36" r="50" fill="#7C3AED" opacity="0.35" />
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#iconGrad)" stroke="rgba(255,255,255,0.20)" stroke-width="1" />
    <g fill="#FFFFFF">
      <rect x="18" y="19" width="7" height="34" rx="2.5" />
      <rect x="29" y="25" width="20" height="7" rx="2.5" opacity="0.96" />
      <rect x="29" y="35" width="27" height="7" rx="2.5" opacity="0.82" />
      <rect x="29" y="45" width="15" height="7" rx="2.5" opacity="0.65" />
    </g>

    <text x="92" y="32" class="sans" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">WordDrill · 背单词</text>
    <text x="94" y="64" class="sans" font-size="18" font-weight="500" fill="#A78BFA">一款真正帮你记住并写出来的背单词软件</text>
  </g>

  <text x="56" y="176" class="sans" font-size="28" font-weight="700" fill="#FFFFFF">先独立回想，再核对；先认得出，再写得出</text>
  <text x="56" y="212" class="sans" font-size="15.5" fill="#94A3B8">认词先问能否独立想起，拒绝蒙选项；FSRS-6 跨日稳定性达标才升阶。</text>
  <text x="56" y="240" class="sans" font-size="15.5" fill="#94A3B8">按词频与难度智能安排每日新词，学习量、拼写模式与复习节奏全面自定义。</text>

  <!-- Feature Pills -->
  <g transform="translate(56, 282)">
    <rect x="0" y="0" width="158" height="38" rx="19" fill="#211A3A" stroke="#7C3AED" stroke-opacity="0.58" />
    <circle cx="20" cy="19" r="4.5" fill="#A78BFA" />
    <text x="34" y="24" class="sans" font-size="14" font-weight="600" fill="#ECEFF5">先独立回想再选</text>

    <rect x="172" y="0" width="158" height="38" rx="19" fill="#0B2720" stroke="#34D399" stroke-opacity="0.45" />
    <circle cx="192" cy="19" r="4.5" fill="#34D399" />
    <text x="206" y="24" class="sans" font-size="14" font-weight="600" fill="#D1FAE5">FSRS-6 跨日升阶</text>

    <rect x="344" y="0" width="158" height="38" rx="19" fill="#181B29" stroke="rgba(167,139,250,0.34)" />
    <circle cx="364" cy="19" r="4.5" fill="#C4B5FD" />
    <text x="378" y="24" class="sans" font-size="14" font-weight="600" fill="#ECEFF5">按难度智能排词</text>
  </g>

  <!-- Right Interactive Recall Gate Motif -->
  <g class="card-float">
    <rect x="656" y="44" width="488" height="236" rx="18" fill="url(#cardGrad)" stroke="rgba(167,139,250,0.22)" stroke-width="1.2" />
    <rect x="680" y="66" width="54" height="24" rx="12" fill="#241C3D" />
    <text x="707" y="82" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#A78BFA">认词</text>
    <rect x="744" y="66" width="128" height="24" rx="12" fill="rgba(255,255,255,0.06)" />
    <text x="808" y="82" text-anchor="middle" class="sans" font-size="12" fill="#94A3B8">先在心里回想词义</text>

    <text x="680" y="140" class="sans" font-size="36" font-weight="700" fill="#FFFFFF" letter-spacing="-0.4">resilient</text>
    <text x="680" y="168" class="sans" font-size="14" fill="#94A3B8">能否不看选项，直接想起它的中文含义？</text>

    <!-- Two signature recall buttons -->
    <rect x="680" y="192" width="214" height="44" rx="11" fill="#7C3AED" />
    <text x="787" y="219" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#FFFFFF">想起了，核对选项</text>

    <rect x="908" y="192" width="212" height="44" rx="11" fill="#181B29" stroke="rgba(167,139,250,0.32)" />
    <text x="1014" y="219" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#CBD5E1">没想起，借助选项</text>

    <text x="680" y="262" class="sans" font-size="12.5" fill="#94A3B8">借助选项答对仅安排再复习，不计升阶天数</text>
  </g>

  <!-- Floating FSRS Pill Bottom Right -->
  <g class="card-float-alt">
    <rect x="696" y="294" width="448" height="52" rx="14" fill="#121420" stroke="rgba(52,211,153,0.35)" stroke-width="1.2" />
    <circle cx="732" cy="320" r="14" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3.5" />
    <circle class="fsrs-arc" cx="732" cy="320" r="14" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" transform="rotate(-90 732 320)" />
    <text x="760" y="317" class="sans" font-size="13" font-weight="600" fill="#34D399">FSRS-6 跨日验证 · 难易搭配 40 / 40 / 20</text>
    <text x="760" y="335" class="sans" font-size="12" fill="#94A3B8">认词 7 天 / 拼写 21 天稳定度达标 → 真正掌握</text>
  </g>
</svg>
