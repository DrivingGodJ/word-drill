name: Build Android & Windows Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'manifest.webmanifest'
      - 'vendor/**'
      - 'icon*'
      - 'apple-touch-icon.png'
      - 'apps/**'
      - 'scripts/sync-web-assets.mjs'
      - '.github/workflows/build-apps.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Sync web bundle to Android assets
        run: node scripts/sync-web-assets.mjs
      - name: Assemble release APK
        working-directory: apps/android
        run: gradle assembleRelease --no-daemon
      - name: Stage APK artifact
        run: |
          mkdir -p release-assets
          cp apps/android/app/build/outputs/apk/release/app-release.apk release-assets/WordDrill-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: worddrill-android-apk
          path: release-assets/WordDrill-android.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Build Windows NSIS & Portable packages
        working-directory: apps/desktop
        run: npm run dist:win
      - name: Stage Windows executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "apps/desktop/dist/WordDrill-Windows-Setup.exe" "release-assets/WordDrill-Windows-Setup.exe"
          Copy-Item "apps/desktop/dist/WordDrill-Windows-Portable.exe" "release-assets/WordDrill-Windows-Portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: worddrill-windows-exe
          path: release-assets/WordDrill-Windows-*.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect build outputs
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.apk' -o -name '*.exe' \) -exec cp {} release-files/ \;
          ls -lh release-files
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          IS_TAG=0
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            IS_TAG=1
          else
            TAG="latest"
          fi
          TITLE="WordDrill 本地离线客户端 (${TAG})"
          NOTES="网页端已本地打包封装，仅在拉取公开词库或同步云端进度时访问网络。\n\n- **Android**：下载 \`WordDrill-android.apk\` 安装，词库位于系统文件管理中的 \`WordDrill 词库\`（\`Android/data/com.drivinggodj.worddrill/files/wordbooks\`）。\n- **Windows**：下载安装版 \`WordDrill-Windows-Setup.exe\` 或绿色免安装版 \`WordDrill-Windows-Portable.exe\`，词库保存在「文档\\\\WordDrill\\\\wordbooks」。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/* --clobber
          else
            if [[ "$IS_TAG" -eq 1 ]]; then
              gh release create "$TAG" release-files/* --title "$TITLE" --notes "$(echo -e "$NOTES")"
            else
              gh release create "$TAG" release-files/* --target main --title "$TITLE" --notes "$(echo -e "$NOTES")"
            fi
          fi
